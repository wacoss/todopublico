<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>To Do List</title>
  <meta name="description" content="Aplicación móvil de lista de tareas y recordatorios con almacenamiento local." />
  <meta property="og:title" content="To Do List" />
  <meta property="og:description" content="Aplicación móvil de lista de tareas y recordatorios con almacenamiento local." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    .hidden { display: none !important; }

    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --card: #ffffff;
      --card-subtle: #f8fafc;
      --surface-2: #edf0f5;
      --surface-2-hover: #e2e6f0;
      --check-bg: #f8fafc;
      /*--today-bg: #eef2ff; */
      --today-bg: #ffeded; 
      --today-border: #c7d2fe;
      --text: #0f172a;
      --text-secondary: #475569;
      --brandtext: #3730a3;
      --muted: #64748b;
      --handle: #94a3b8;
      --checkbox: #94a3b8;
      --icon: #4f46e5;
      --icon-hover: #4338ca;
      --icon-hover-bg: #e0e7ff;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #10b981;
      --success-bg: #d1fae5;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --focus-ring: 0 0 0 3px rgba(79, 70, 229, 0.25);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-float: 0 10px 25px -5px rgba(79, 70, 229, 0.3), 0 8px 10px -6px rgba(79, 70, 229, 0.2);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
      --t-fast: .15s cubic-bezier(0.4, 0, 0.2, 1);
      --t-base: .2s cubic-bezier(0.4, 0, 0.2, 1);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html.dark {
      --bg: #0b0f19;
      --panel: #131b2e;
      --card: #172138;
      --card-subtle: #1a253e;
      --surface-2: #1e293b;
      --surface-2-hover: #2d3b55;
      --check-bg: #151e30;
      --today-bg: linear-gradient(135deg, rgba(79, 70, 229, 0.18), rgba(99, 102, 241, 0.12));
      --today-border: rgba(99, 102, 241, 0.45);
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --brandtext: #e0e7ff;
      --muted: #94a3b8;
      --handle: #64748b;
      --checkbox: #64748b;
      --icon: #6366f1;
      --icon-hover: #818cf8;
      --icon-hover-bg: rgba(99, 102, 241, 0.18);
      --danger: #f87171;
      --danger-bg: rgba(239, 68, 68, 0.16);
      --success: #34d399;
      --success-bg: rgba(16, 185, 129, 0.16);
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.04);
      --focus-ring: 0 0 0 3px rgba(99, 102, 241, 0.35);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-float: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      line-height: 1.4;
      overflow-x: hidden;
    }

    /* Contenedor optimizado para pantalla de celular */
    .app-viewport {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
      padding-bottom: calc(85px + var(--safe-bottom));
    }

    /* Barra Superior Móvil */
    .mobile-header {
      position: relative;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + var(--safe-top)) 16px 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--icon), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3);
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }

    .brand-text-wrap {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon-top {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--card-subtle);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all var(--t-fast);
      touch-action: manipulation;
    }

    .btn-icon-top:active {
      transform: scale(0.92);
      background: var(--surface-2-hover);
    }

    .btn-icon-top svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-icon-top.active-push {
      color: var(--icon);
      border-color: var(--icon);
      background: var(--icon-hover-bg);
    }

    .btn-icon-top.active-push::after {
      content: '';
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--icon);
      border: 1.5px solid var(--panel);
    }

    /* Pestañas Móviles Segmentadas */
    .mobile-tabs-container {
      padding: 12px 14px 6px 14px;
    }

    .segmented-tabs {
      display: flex;
      background: var(--surface-2);
      border-radius: var(--radius-lg);
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .seg-tab-btn {
      flex: 1;
      padding: 9px 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--t-fast);
      touch-action: manipulation;
      position: relative;
    }

    .seg-tab-btn.active {
      background: var(--panel);
      color: var(--icon);
      box-shadow: var(--shadow-sm);
    }

    .tab-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 12px;
      background: var(--surface-2-hover);
      color: var(--muted);
      line-height: 1.3;
    }

    .seg-tab-btn.active .tab-badge {
      background: var(--icon-hover-bg);
      color: var(--icon);
    }

    /* Fila de Fecha de Hoy (intercalada cronológicamente) */
    .today-summary-bar {
      margin: 0;
      background: var(--today-bg);
      border: 1px solid var(--today-border);
      border-radius: var(--radius-lg);
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .today-badge-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: var(--icon-hover-bg);
      color: var(--icon);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .today-badge-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    .today-text-date {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Contenedor de la lista de tareas */
    .tasks-container {
      padding: 0 14px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Tarjetas de Tarea */
    .task-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
      touch-action: pan-y;
    }

    .task-card.tarea-eshoy {
      background: var(--today-bg);
      border-color: var(--today-border);
    }

    .task-card.dragging {
      opacity: 0.45;
      transform: scale(0.98);
      border: 1.5px dashed var(--icon);
    }

    /* Fila superior de la tarjeta: checkbox, fecha y acciones rápidas */
    .card-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Touch Checkbox */
    .check-touch-target {
      width: 36px;
      height: 36px;
      min-width: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: -6px;
      touch-action: manipulation;
    }

    .check {
      appearance: none;
      -webkit-appearance: none;
      width: 21px;
      height: 21px;
      border: 2px solid var(--checkbox);
      border-radius: var(--radius-sm);
      background: var(--check-bg);
      cursor: pointer;
      position: relative;
      transition: all var(--t-fast);
      margin: 0;
    }

    .check:checked {
      background: var(--icon);
      border-color: var(--icon);
    }

    .check:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 6px;
      height: 10px;
      border: solid #fff;
      border-width: 0 2.2px 2.2px 0;
      transform: rotate(45deg);
    }

    .check:disabled {
      cursor: default;
      opacity: 0.5;
    }

    /* Chip de Fecha */
    .date-chip {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--border);
      background: var(--card-subtle);
      border-radius: 20px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all var(--t-fast);
      touch-action: manipulation;
    }

    .date-chip:active {
      transform: scale(0.95);
      border-color: var(--icon);
    }

    .date-chip svg {
      width: 13px;
      height: 13px;
      color: var(--icon);
      stroke-width: 2;
    }

    .date-chip.is-today {
      background: var(--icon-hover-bg);
      color: var(--icon);
      border-color: var(--today-border);
    }

    .date-chip.is-today svg {
      color: var(--icon);
    }

    .date-chip.no-hover {
      cursor: default;
      pointer-events: none;
    }

    /* Grupo de Botones de Acción Móvil */
    .card-actions-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .touch-action-btn {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--t-fast);
      touch-action: manipulation;
    }

    .touch-action-btn:active {
      transform: scale(0.9);
      background: var(--surface-2-hover);
    }

    .touch-action-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .touch-action-btn.active-icon {
      color: var(--icon);
      background: var(--icon-hover-bg);
    }

    .touch-action-btn.reminder-active {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .touch-action-btn.btn-danger {
      color: var(--danger);
    }

    .touch-action-btn.btn-danger:active {
      background: var(--danger-bg);
    }

    .touch-action-btn.btn-restore {
      color: var(--success);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .touch-action-btn.btn-restore:active {
      background: var(--success-bg);
    }

    /* Área de texto para el título y descripción (16px para evitar auto-zoom de iOS) */
    .card-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-input,
    .desc-input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      font-family: inherit;
      resize: none;
      overflow: hidden;
      outline: none;
      color: var(--text);
      line-height: 1.35;
      padding: 4px 6px;
      margin-left: -6px;
      transition: background-color var(--t-fast), border-color var(--t-fast);
    }

    .title-input {
      font-size: 16px; /* 16px previene que Safari en iPhone haga zoom involuntario */
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .title-input:focus,
    .desc-input:focus {
      background: var(--surface-2);
      border-color: var(--icon);
    }

    .desc-wrap {
      margin-top: 2px;
      padding-top: 4px;
      border-top: 1px dashed var(--border);
    }

    .desc-wrap.hidden {
      display: none;
    }

    .desc-input {
      font-size: 14px;
      color: var(--text-secondary);
      min-height: 28px;
    }

    .title-static {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      padding: 4px 0;
    }

    .desc-static {
      font-size: 13.5px;
      color: var(--muted);
      padding: 2px 0;
      white-space: pre-wrap;
    }

    /* Botones de Mover arriba/abajo para Secundaria */
    .reorder-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-reorder-arrow {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: all var(--t-fast);
      padding: 0;
    }

    .btn-reorder-arrow svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }

    .btn-reorder-arrow:not(:disabled):active {
      background: var(--icon-hover-bg);
      color: var(--icon);
      border-color: var(--icon);
      transform: scale(0.92);
    }

    .btn-reorder-arrow:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Estado Vacío */
    .empty-state-box {
      text-align: center;
      padding: 44px 20px;
      background: var(--panel);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-xl);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .empty-icon-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-icon-circle svg {
      width: 26px;
      height: 26px;
      stroke-width: 1.8;
    }

    .empty-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .empty-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 260px;
      line-height: 1.4;
    }

    /* Botón Flotante para Agregar Tarea (FAB) - Optimizado para el Pulgar */
    .mobile-fab-container {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      z-index: 50;
    }

    .fab-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--icon), #6366f1);
      color: #fff;
      border: none;
      box-shadow: var(--shadow-float);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform var(--t-fast), box-shadow var(--t-fast), opacity var(--t-fast);
      touch-action: manipulation;
    }

    .fab-btn:active {
      transform: scale(0.9);
    }

    .fab-btn svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.5;
      stroke: currentColor;
      fill: none;
    }

    .fab-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.5);
    }

    /* Modal / Bottom Sheet del Calendario Móvil */
    .mobile-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity var(--t-base);
    }

    .mobile-modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .calendar-bottom-sheet {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      border-top: 1px solid var(--border);
      padding: 16px 20px calc(24px + var(--safe-bottom)) 20px;
      box-shadow: var(--shadow-modal);
      transform: translateY(100%);
      transition: transform var(--t-base);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .mobile-modal-backdrop.show .calendar-bottom-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      background: var(--handle);
      border-radius: 4px;
      margin: 0 auto 6px auto;
      opacity: 0.6;
    }

    .cal-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cal-title-month {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .cal-nav-buttons {
      display: flex;
      gap: 6px;
    }

    .cal-nav-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .cal-nav-btn:active {
      background: var(--icon-hover-bg);
      color: var(--icon);
    }

    /* Accesos rápidos a fechas en el calendario */
    .cal-quick-picks {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 4px;
      scrollbar-width: none;
    }

    .cal-quick-picks::-webkit-scrollbar {
      display: none;
    }

    .cal-quick-pill {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    .cal-quick-pill:active {
      background: var(--icon-hover-bg);
      color: var(--icon);
      border-color: var(--icon);
    }

    .cal-grid-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .cal-day-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      padding: 4px 0;
      text-transform: uppercase;
    }

    .cal-cell {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      touch-action: manipulation;
      transition: background-color var(--t-fast), color var(--t-fast);
    }

    .btn-sheet-secondary,

    .btn-sheet-secondary:active {

    }

    .btn-sheet-primary {
      background: var(--icon);
      color: #fff;
    }

    .btn-sheet-primary:active {
      background: var(--icon-hover);
    }

    /* Notificación Toast Móvil */
    .mobile-toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 16px;
      box-shadow: var(--shadow-modal);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      z-index: 1000;
      opacity: 0;
      transition: transform var(--t-base), opacity var(--t-base);
      pointer-events: none;
      white-space: nowrap;
    }

    .mobile-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--icon);
    }

    /* Compatibilidad para pantallas grandes / escritorio */
    @media (min-width: 640px) {
      body {
        padding: 20px 10px;
        background: #e2e8f0;
      }
      html.dark body {

        border-radius: var(--radius-xl);
        margin-bottom: 40px;
      }

        position: absolute;
      }
    }
  </style>
</head>

<div id="mobileToast" class="mobile-toast" role="status" aria-live="polite">

<script>
  // ==========================================
  // Configuración de Web Push y Cloudflare Worker
  // ==========================================
  const WORKER_URL = 'https://dawn-rain-0ea5.jaunin.workers.dev/'; 
  const VAPID_PUBLIC_KEY = 'BHkz_vETNFSEpTrgIoRmN8BAmetNAbZ0h1W8N1F84aI9zyBteQparaXVtpV_rFPHtKJY4-818yOAdnNYKXsElok'; 

  function mostrarToast(mensaje) {
    const toast = document.getElementById('mobileToast');
    const toastMsg = document.getElementById('toastMessage');
    if (!toast || !toastMsg) return;
    toastMsg.textContent = mensaje;
    toast.classList.add('show');
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2400);
  }

  function urlBase64ToUint8Array(base64String) {
    if (!base64String || base64String.includes('TU_VAPID')) return null;
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  function obtenerUserId() {
    let uid = safeGetItem('todo_device_uid');
    if (!uid) {
      uid = 'dev_' + Math.random().toString(36).slice(2, 12);
      safeSetItem('todo_device_uid', uid);
    }
    return uid;
  }

  async function actualizarEstadoBotonPush() {
    const btn = document.getElementById('btnNotificaciones');
    if (!btn) return;
    if (!('Notification' in window) || !('serviceWorker' in navigator)) {
      btn.style.opacity = '0.5';
      btn.title = 'Notificaciones no soportadas en este navegador';
      return;
    }
    if (Notification.permission === 'granted') {
      btn.classList.add('active-push');
      btn.title = 'Recordatorios push activados';
    } else {
      btn.classList.remove('active-push');
      btn.title = 'Toca para activar recordatorios push';
    }
  }

  async function activarNotificacionesPush() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      mostrarToast('Notificaciones no soportadas en este navegador');
      return;
    }

    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        mostrarToast('Permiso de notificaciones no concedido');
        actualizarEstadoBotonPush();
        return;
      }

      const reg = await navigator.serviceWorker.register('./sw.js');
      await navigator.serviceWorker.ready;

      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        const keyArray = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
        const subOptions = { userVisibleOnly: true };
        if (keyArray) subOptions.applicationServerKey = keyArray;
        sub = await reg.pushManager.subscribe(subOptions);
      }

      if (WORKER_URL && !WORKER_URL.includes('TU-SUBDOMINIO')) {
        await fetch(`${WORKER_URL}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: obtenerUserId(),
            subscription: sub
          })
        });
        await sincronizarRecordatoriosConWorker();
      }
      actualizarEstadoBotonPush();
      mostrarToast('¡Recordatorios activados!');
    } catch (err) {
      console.error('Error configurando Web Push:', err);
      mostrarToast('Error al activar recordatorios');
    }
  }

  let syncTimeout;
  function sincronizarRecordatoriosConWorker() {
    if (!WORKER_URL || WORKER_URL.includes('TU-SUBDOMINIO')) return;
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(async () => {
      try {
        const userId = obtenerUserId();
        const tareasConFecha = (tareasGlobales.principal || [])
          .filter(t => !t.especial && t.fecha && t.recordar)
          .map(t => ({ id: t.id, tarea: t.tarea, nota: t.nota, fecha: t.fecha }));

        await fetch(`${WORKER_URL}/api/reminders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, reminders: tareasConFecha })
        });
      } catch (e) {
        console.warn('No se pudo sincronizar con Cloudflare Worker:', e);
      }
    }, 1500);
  }

  // ==========================================
  // Estado y Persistencia Local
  // ==========================================
  const STORAGE_KEY = 'todoLocalStorageV10';
  const THEME_KEY = 'todoLocalThemeV2';
  
  const NOMBRES_DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const NOMBRES_MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  let pestanaActiva = 'principal';
  let tareasGlobales = cargarEstado();
  let calAñoAct = new Date().getFullYear();
  let calMesAct = new Date().getMonth();
  let tareaCalendarioId = null;

  function safeGetItem(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function safeSetItem(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
  }

  function uid() {
    return 'task-' + Math.random().toString(36).slice(2, 10);
  }

  function hoyISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function clonarEstadoBase() {
    return {
      principal: [
        { id: uid(), tarea: 'Tarea de ejemplo', nota: '', fecha: hoyISO(), recordar: false, creada: Date.now() }
      ],
      secundaria: [],
      completadas: []
    };
  }

  function cargarEstado() {
    try {
      const raw = safeGetItem(STORAGE_KEY);
      if (!raw) return clonarEstadoBase();
      return normalizarEstado(JSON.parse(raw));
    } catch (e) {
      return clonarEstadoBase();
    }
  }

  function normalizarEstado(data) {
    const normalizeTask = (t) => ({
      id: t && t.id ? t.id : uid(),
      tarea: t && t.tarea ? t.tarea : 'Nueva tarea',
      nota: t && t.nota ? t.nota : '',
      fecha: t && t.fecha ? t.fecha : '',
      recordar: !!(t && t.recordar),
      creada: t && t.creada ? t.creada : Date.now(),
      especial: !!(t && t.especial)
    });

    return {
      principal: Array.isArray(data && data.principal) ? data.principal.map(normalizeTask) : [],
      secundaria: Array.isArray(data && data.secundaria) ? data.secundaria.map(normalizeTask) : [],
      completadas: Array.isArray(data && data.completadas) ? data.completadas.map(normalizeTask) : []
    };
  }

  function guardarEstado() {
    safeSetItem(STORAGE_KEY, JSON.stringify(tareasGlobales));
    sincronizarRecordatoriosConWorker();
    actualizarBadges();
  }

  function bindAutosize(el) {
    if (!el || el.tagName !== 'TEXTAREA') return;
    const auto = () => {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    };
    el.addEventListener('input', auto);
    requestAnimationFrame(auto);
  }

  function cambiarPestana(tipo) {
    if (pestanaActiva === tipo) return;
    pestanaActiva = tipo;
    cerrarCalendario();

    ['principal', 'secundaria', 'completadas'].forEach(t => {
      const cap = t.charAt(0).toUpperCase() + t.slice(1);
      const el = document.getElementById('tab' + cap);
      if (el) {
        el.classList.toggle('active', tipo === t);
        el.setAttribute('aria-selected', String(tipo === t));
      }
    });

    renderizar();
  }

  function obtenerListaActiva() {
    return tareasGlobales[pestanaActiva];
  }

  function ordenarPorFecha(lista) {
    return lista.slice().sort((a, b) => {
      if (a.fecha && b.fecha) return a.fecha.localeCompare(b.fecha);
      if (a.fecha) return -1;
      if (b.fecha) return 1;
      return a.creada - b.creada;
    });
  }

  function etiquetaFecha(iso) {
    if (!iso) return 'Sin fecha';
    const hoy = hoyISO();
    if (iso === hoy) return 'Hoy';
    
    // Mañana
    const manana = new Date();
    manana.setDate(manana.getDate() + 1);
    const mStr = `${manana.getFullYear()}-${String(manana.getMonth()+1).padStart(2,'0')}-${String(manana.getDate()).padStart(2,'0')}`;
    if (iso === mStr) return 'Mañana';

    const p = iso.split('-');
    return `${parseInt(p[2], 10)}/${parseInt(p[1], 10)}/${p[0]}`;
  }

  function esHoy(iso) {
    return !!iso && iso === hoyISO();
  }

  function crearTextarea(clase, valor, placeholder, onChange) {
    const el = document.createElement('textarea');
    el.className = clase;
    el.rows = 1;
    el.placeholder = placeholder || '';
    el.value = valor || '';
    bindAutosize(el);
    el.addEventListener('change', onChange);
    return el;
  }

  function actualizarBotonNuevaTarea() {
    const btn = document.getElementById('btnNuevaTarea');
    if (btn) btn.classList.toggle('hidden', pestanaActiva === 'completadas');
  }

  function actualizarBadges() {
    const bp = document.getElementById('badgePrincipal');
    const bs = document.getElementById('badgeSecundaria');
    const bc = document.getElementById('badgeCompletadas');
    if (bp) bp.textContent = tareasGlobales.principal.length;
    if (bs) bs.textContent = tareasGlobales.secundaria.length;
    if (bc) bc.textContent = tareasGlobales.completadas.length;
  }

  function crearFilaHoy() {
    const bar = document.createElement('div');
    bar.className = 'today-summary-bar';
    bar.id = 'resumenHoyBar';
    const d = new Date();
    const hoyTexto = `Hoy es ${NOMBRES_DIAS[d.getDay()]} ${d.getDate()} de ${NOMBRES_MESES[d.getMonth()]}`;

    bar.innerHTML = `
      <div class="today-badge-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </div>
      <span class="today-text-date">${hoyTexto}</span>
    `;
    return bar;
  }

  function renderizar() {
    actualizarBotonNuevaTarea();
    actualizarBadges();
    const contenedor = document.getElementById('listaTareas');
    contenedor.innerHTML = '';

    let tareas = obtenerListaActiva().slice();
    if (pestanaActiva === 'principal' || pestanaActiva === 'completadas') tareas = ordenarPorFecha(tareas);

    if (pestanaActiva === 'principal') {
      let filaHoyInsertada = false;
      const hoy = hoyISO();

      tareas.forEach((t, index) => {
        // Intercalar la fila de hoy en su orden cronológico exacto
        if (!filaHoyInsertada && (!t.fecha || t.fecha >= hoy)) {
          contenedor.appendChild(crearFilaHoy());
          filaHoyInsertada = true;
        }
        contenedor.appendChild(crearFilaTarea(t, index, tareas.length));
      });

      // Si todas las tareas tenían fecha previa a hoy (o no hay tareas)
      if (!filaHoyInsertada) {
        contenedor.appendChild(crearFilaHoy());
      }

      if (tareas.length === 0) {
        const vacio = document.createElement('div');
        vacio.className = 'empty-state-box';
        vacio.innerHTML = `
          <div class="empty-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          </div>
          <span class="empty-title">Lista vacía</span>
          <span class="empty-subtitle">No tienes tareas pendientes.<br>Usa el botón + para añadir una.</span>
        `;
        contenedor.appendChild(vacio);
      }
      return;
    }

    if (tareas.length === 0) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state-box';
      let msg = 'No tienes tareas secundarias.<br>Usa el botón + para añadir una.';
      if (pestanaActiva === 'completadas') {
        msg = 'Aún no hay tareas completadas.';
      }
      vacio.innerHTML = `
        <div class="empty-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <span class="empty-title">Lista vacía</span>
        <span class="empty-subtitle">${msg}</span>
      `;
      contenedor.appendChild(vacio);
      return;
    }

    tareas.forEach((t, index) => contenedor.appendChild(crearFilaTarea(t, index, tareas.length)));
  }

  function crearFilaTarea(t, index, totalTareas) {
    const card = document.createElement('article');
    card.dataset.id = t.id;
    card.dataset.index = index;

    const claseBase = 'task-card';
    if (pestanaActiva === 'secundaria') card.className = `${claseBase} tarea-secundaria`;
    else if (pestanaActiva === 'completadas') card.className = `${claseBase} tarea-completada`;
    else card.className = esHoy(t.fecha) ? `${claseBase} tarea-eshoy` : claseBase;

    // Fila Superior (Checkbox / Fecha / Reordenar / Acciones)
    const topRow = document.createElement('div');
    topRow.className = 'card-top-row';

    // Checkbox en Principal
    if (pestanaActiva === 'principal') {
      const checkWrap = document.createElement('label');
      checkWrap.className = 'check-touch-target';
      checkWrap.title = 'Marcar como completada';

      const check = document.createElement('input');
      check.className = 'check';
      check.type = 'checkbox';
      check.addEventListener('change', () => {
        card.style.transform = 'scale(0.95)';
        card.style.opacity = '0.5';
        setTimeout(() => completarTarea(t.id), 180);
      });

      checkWrap.appendChild(check);
      topRow.appendChild(checkWrap);

      // Chip de Fecha con icono de calendario
      const dateChip = document.createElement('button');
      dateChip.className = 'date-chip' + (esHoy(t.fecha) ? ' is-today' : '');
      dateChip.type = 'button';
      dateChip.title = 'Cambiar fecha de la tarea';
      dateChip.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>${etiquetaFecha(t.fecha)}</span>
      `;
      dateChip.addEventListener('click', (e) => {
        e.stopPropagation();
        abrirMiCalendario(t.id);
      });
      topRow.appendChild(dateChip);
    }

    // Botones de Mover arriba/abajo en Secundaria
    if (pestanaActiva === 'secundaria') {
      const reorderGroup = document.createElement('div');
      reorderGroup.className = 'reorder-group';

      const btnUp = document.createElement('button');
      btnUp.type = 'button';
      btnUp.className = 'btn-reorder-arrow';
      btnUp.title = 'Mover arriba';
      btnUp.setAttribute('aria-label', 'Mover tarea arriba');
      btnUp.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>';
      if (index === 0) {
        btnUp.disabled = true;
      } else {
        btnUp.onclick = () => moverTareaSecundaria(t.id, -1);
      }

      const btnDown = document.createElement('button');
      btnDown.type = 'button';
      btnDown.className = 'btn-reorder-arrow';
      btnDown.title = 'Mover abajo';
      btnDown.setAttribute('aria-label', 'Mover tarea abajo');
      btnDown.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>';
      if (index === (totalTareas || 1) - 1) {
        btnDown.disabled = true;
      } else {
        btnDown.onclick = () => moverTareaSecundaria(t.id, 1);
      }

      reorderGroup.appendChild(btnUp);
      reorderGroup.appendChild(btnDown);
      topRow.appendChild(reorderGroup);
    }

    // Chip de fecha en Completadas
    if (pestanaActiva === 'completadas') {
      const dateChip = document.createElement('div');
      dateChip.className = 'date-chip no-hover';
      dateChip.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>${etiquetaFecha(t.fecha)}</span>
      `;
      topRow.appendChild(dateChip);
    }

    // Acciones a la derecha
    const actions = document.createElement('div');
    actions.className = 'card-actions-group';

    // Si está en completadas: botón restaurar y eliminar
    if (pestanaActiva === 'completadas') {
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'touch-action-btn btn-restore';
      restoreBtn.type = 'button';
      restoreBtn.title = 'Restaurar a Principal';
      restoreBtn.innerHTML = '↺';
      restoreBtn.addEventListener('click', () => restablecerTarea(t.id));
      actions.appendChild(restoreBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'touch-action-btn btn-danger';
      deleteBtn.type = 'button';
      deleteBtn.title = 'Eliminar permanentemente';
      deleteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
      deleteBtn.addEventListener('click', () => eliminarTarea('completadas', t.id));
      actions.appendChild(deleteBtn);

      topRow.appendChild(actions);
      card.appendChild(topRow);

      // Cuerpo estático en completadas
      const body = document.createElement('div');
      body.className = 'card-body';
      const titleStatic = document.createElement('div');
      titleStatic.className = 'title-static';
      titleStatic.textContent = t.tarea || '';
      body.appendChild(titleStatic);

      if (t.nota && t.nota.trim() !== '') {
        const descStatic = document.createElement('div');
        descStatic.className = 'desc-static';
        descStatic.textContent = t.nota;
        body.appendChild(descStatic);
      }
      card.appendChild(body);
      return card;
    }

    // Botón de nota opcional
    const hasNote = Boolean(t.nota && t.nota.trim() !== '');
    const toggleNoteBtn = document.createElement('button');
    toggleNoteBtn.className = 'touch-action-btn' + (hasNote ? ' active-icon' : '');
    toggleNoteBtn.type = 'button';
    toggleNoteBtn.title = hasNote ? 'Ocultar nota' : 'Añadir nota';
    toggleNoteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 19h16"></path><path d="M7 5h10"></path><path d="M7 9h10"></path><path d="M7 13h6"></path></svg>';
    actions.appendChild(toggleNoteBtn);

    // Botón de recordatorio (solo en Principal)
    if (pestanaActiva === 'principal') {
      const reminderBtn = document.createElement('button');
      reminderBtn.className = 'touch-action-btn' + (t.recordar ? ' reminder-active' : '');
      reminderBtn.type = 'button';
      reminderBtn.title = t.recordar ? 'Recordatorio activo (toca para desactivar)' : 'Recordatorio desactivado (toca para activar)';
      reminderBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>';
      reminderBtn.addEventListener('click', () => {
        const nuevo = !t.recordar;
        actualizarTarea('principal', t.id, { recordar: nuevo });
        mostrarToast(nuevo ? '🔔 Recordatorio activado' : '🔕 Recordatorio desactivado');
      });
      actions.appendChild(reminderBtn);
    }

    // Botón eliminar en Secundaria
    if (pestanaActiva === 'secundaria') {
      const delBtn = document.createElement('button');
      delBtn.className = 'touch-action-btn btn-danger';
      delBtn.type = 'button';
      delBtn.title = 'Eliminar tarea';
      delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
      delBtn.addEventListener('click', () => eliminarTarea('secundaria', t.id));
      actions.appendChild(delBtn);
    }

    topRow.appendChild(actions);
    card.appendChild(topRow);

    // Cuerpo de la tarjeta: Título y Nota editable
    const body = document.createElement('div');
    body.className = 'card-body';

    const titleInput = crearTextarea('title-input', t.tarea, 'Escribe el nombre de la tarea...', () => {
      actualizarTarea(pestanaActiva, t.id, { tarea: titleInput.value.trim() || 'Nueva tarea' });
    });
    body.appendChild(titleInput);

    const descWrap = document.createElement('div');
    descWrap.className = 'desc-wrap' + (hasNote ? '' : ' hidden');

    const descInput = crearTextarea('desc-input', t.nota, 'Detalles o nota opcional...', () => {
      actualizarTarea(pestanaActiva, t.id, { nota: descInput.value.trim() });
    });

    descWrap.appendChild(descInput);
    body.appendChild(descWrap);
    card.appendChild(body);

    toggleNoteBtn.addEventListener('click', () => {
      const isHidden = descWrap.classList.contains('hidden');
      descWrap.classList.toggle('hidden', !isHidden);
      toggleNoteBtn.classList.toggle('active-icon', isHidden);
      if (isHidden) {
        requestAnimationFrame(() => descInput.focus());
      }
    });

    // Soporte Drag and Drop escritorio
    return card;
  }

  function moverTareaSecundaria(id, direccion) {
    const idx = tareasGlobales.secundaria.findIndex(t => t.id === id);
    if (idx === -1) return;
    const nuevoIdx = idx + direccion;
    if (nuevoIdx < 0 || nuevoIdx >= tareasGlobales.secundaria.length) return;

    const [item] = tareasGlobales.secundaria.splice(idx, 1);
    tareasGlobales.secundaria.splice(nuevoIdx, 0, item);
    guardarEstado();
    renderizar();
  }

  // ==========================================
  // Calendario Móvil (Bottom Sheet Modal)
  // ==========================================
  function abrirMiCalendario(taskId) {
    tareaCalendarioId = taskId;
    const tarea = tareasGlobales.principal.find(t => t.id === taskId);
    if (!tarea || tarea.especial) return;

    if (tarea.fecha) {
      const p = tarea.fecha.split('-');
      calAñoAct = parseInt(p[0], 10);
      calMesAct = parseInt(p[1], 10) - 1;
    } else {
      const hoy = new Date();
      calAñoAct = hoy.getFullYear();
      calMesAct = hoy.getMonth();
    }

    dibujarMes();
    const modal = document.getElementById('modalCalendario');
    if (modal) {
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
    }
  }

  function cerrarCalendario() {
    const modal = document.getElementById('modalCalendario');
    if (modal) {
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden', 'true');
    }
    tareaCalendarioId = null;
  }

  function cambiarMes(dir) {
    calMesAct += dir;
    if (calMesAct < 0) {
      calMesAct = 11;
      calAñoAct--;
    }
    if (calMesAct > 11) {
      calMesAct = 0;
      calAñoAct++;
    }
    dibujarMes();
  }

  function dibujarMes() {
    const titulo = document.getElementById('calMesAno');
    if (titulo) titulo.innerText = `${NOMBRES_MESES[calMesAct]} ${calAñoAct}`;

    const diasMes = new Date(calAñoAct, calMesAct + 1, 0).getDate();
    const indexPrimerDia = new Date(calAñoAct, calMesAct, 1).getDay();
    const inicio = indexPrimerDia === 0 ? 6 : indexPrimerDia - 1;

    const hoy = new Date();
    const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;

    const tarea = tareasGlobales.principal.find(t => t.id === tareaCalendarioId);
    const fechaSeleccionada = tarea ? tarea.fecha : '';

    let html = '';
    for (let i = 0; i < inicio; i++) html += '<div class="cal-cell muted"></div>';

    for (let i = 1; i <= diasMes; i++) {
      const d = String(i).padStart(2, '0');
      const m = String(calMesAct + 1).padStart(2, '0');
      const fechaStr = `${calAñoAct}-${m}-${d}`;

      let clases = 'cal-cell';
      if (fechaSeleccionada === fechaStr) clases += ' selected';
      if (fechaStr === hoyStr) clases += ' today';

      html += `<button type="button" class="${clases}" data-fecha="${fechaStr}">${i}</button>`;
    }

    const grid = document.getElementById('calGrid');
    if (grid) grid.innerHTML = html;
  }

  function seleccionarDia(fechaStr) {
    const tarea = tareasGlobales.principal.find(t => t.id === tareaCalendarioId);
    if (!tarea || tarea.especial) return;
    const nuevaFecha = tarea.fecha === fechaStr ? '' : fechaStr;
    actualizarTarea('principal', tarea.id, { fecha: nuevaFecha });
    cerrarCalendario();
    mostrarToast(nuevaFecha ? `Fecha asignada: ${etiquetaFecha(nuevaFecha)}` : 'Fecha eliminada');
  }

  function seleccionarAtajoFecha(tipo) {
    const tarea = tareasGlobales.principal.find(t => t.id === tareaCalendarioId);
    if (!tarea || tarea.especial) return;

    let targetDate = '';
    const hoy = new Date();

    if (tipo === 'hoy') {
      targetDate = hoyISO();
    } else if (tipo === 'manana') {
      const m = new Date();
      m.setDate(hoy.getDate() + 1);
      targetDate = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}-${String(m.getDate()).padStart(2, '0')}`;
    } else if (tipo === 'semana') {
      const m = new Date();
      m.setDate(hoy.getDate() + 7);
      targetDate = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}-${String(m.getDate()).padStart(2, '0')}`;
    } else if (tipo === 'sin-fecha') {
      targetDate = '';
    }

    actualizarTarea('principal', tarea.id, { fecha: targetDate });
    cerrarCalendario();
    mostrarToast(targetDate ? `Fecha asignada: ${etiquetaFecha(targetDate)}` : 'Fecha eliminada');
  }

  // ==========================================
  // Operaciones de Tareas (CRUD)
  // ==========================================
  function crearNuevaTarea() {
    const destino = pestanaActiva === 'completadas' ? 'principal' : pestanaActiva;
    const nuevaId = uid();
    tareasGlobales[destino].push({
      id: nuevaId,
      tarea: 'Nueva tarea',
      nota: '',
      fecha: destino === 'principal' ? hoyISO() : '',
      recordar: false,
      creada: Date.now()
    });
    guardarEstado();

    if (pestanaActiva === 'completadas') {
      cambiarPestana('principal');
    } else {
      renderizar();
    }

    // Enfocar automáticamente la nueva tarea creada
    requestAnimationFrame(() => {
      const newCard = document.querySelector(`.task-card[data-id="${nuevaId}"]`);
      if (newCard) {
        newCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const input = newCard.querySelector('.title-input');
        if (input) {
          input.focus();
          input.select();
        }
      }
    });

    mostrarToast('Nueva tarea añadida');
  }

  function actualizarTarea(lista, id, patch) {
    const item = tareasGlobales[lista].find(x => x.id === id);
    if (!item || item.especial) return;
    Object.assign(item, patch);
    guardarEstado();
    renderizar();
  }

  function eliminarTarea(lista, id) {
    if (!confirm('¿Eliminar esta tarea?')) return;
    tareasGlobales[lista] = tareasGlobales[lista].filter(x => x.id !== id);
    guardarEstado();
    renderizar();
    mostrarToast('Tarea eliminada');
  }

  function completarTarea(id) {
    const idx = tareasGlobales.principal.findIndex(x => x.id === id);
    if (idx === -1) return;
    const tarea = tareasGlobales.principal[idx];
    if (tarea.especial) return;
    tareasGlobales.principal.splice(idx, 1);
    tareasGlobales.completadas.unshift({ ...tarea, recordar: false });
    guardarEstado();
    renderizar();
    mostrarToast('¡Tarea completada! 🎉');
  }

  function restablecerTarea(id) {
    const idx = tareasGlobales.completadas.findIndex(x => x.id === id);
    if (idx === -1) return;
    const tarea = tareasGlobales.completadas[idx];
    tareasGlobales.completadas.splice(idx, 1);
    tareasGlobales.principal.unshift({
      ...tarea,
      id: uid(),
      recordar: false,
      creada: Date.now()
    });
    guardarEstado();
    cambiarPestana('principal');
    mostrarToast('Tarea restaurada a Principal');
  }

  // ==========================================
  // Tema Claro / Oscuro
  // ==========================================
  function aplicarTema(theme) {
    const isDark = theme === 'dark';
    document.documentElement.classList.toggle('dark', isDark);

    const sun = document.getElementById('themeIconSun');
    const moon = document.getElementById('themeIconMoon');
    if (sun && moon) {
      sun.classList.toggle('hidden', !isDark);
      moon.classList.toggle('hidden', isDark);
    }
  }

  function inicializarTema() {
    const saved = safeGetItem(THEME_KEY) || 'light';
    aplicarTema(saved);

    const btnTema = document.getElementById('btnTema');
    if (btnTema) {
      btnTema.addEventListener('click', () => {
        const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        safeSetItem(THEME_KEY, next);
        aplicarTema(next);
        mostrarToast(next === 'dark' ? 'Modo oscuro activado' : 'Modo claro activado');
      });
    }
  }

  // ==========================================
  // Inicialización de la Aplicación
  // ==========================================
  document.addEventListener('DOMContentLoaded', () => {
    actualizarEstadoBotonPush();
    inicializarTema();

    // Eventos del calendario móvil
    const calPrev = document.getElementById('calPrev');
    const calNext = document.getElementById('calNext');
    if (calPrev) calPrev.addEventListener('click', () => cambiarMes(-1));
    if (calNext) calNext.addEventListener('click', () => cambiarMes(1));

    const calGrid = document.getElementById('calGrid');
    if (calGrid) {
      calGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('.cal-cell[data-fecha]');
        if (!btn) return;
        seleccionarDia(btn.dataset.fecha);
      });
    }

    const modalCal = document.getElementById('modalCalendario');
    if (modalCal) {
      modalCal.addEventListener('click', (e) => {
        if (e.target === modalCal) cerrarCalendario();
      });
    }

    renderizar();
  });
</script>

</body>
</html>
